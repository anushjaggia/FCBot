name: FirstCry stock monitor

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch: {}

# Never run two passes at once: overlapping runs could double-order.
concurrency:
  group: firstcry-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright pytest

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run notification-logic tests
        run: python -m pytest -q

      - name: Restore stock state
        uses: actions/cache@v4
        with:
          path: firstcry_state.json
          key: firstcry-state-${{ github.run_id }}
          restore-keys: |
            firstcry-state-

      - name: Restore FirstCry session
        uses: actions/cache@v4
        with:
          path: firstcry_session.json.enc
          key: firstcry-session-${{ github.run_id }}
          restore-keys: |
            firstcry-session-

      - name: Decrypt FirstCry session
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          if [ -f firstcry_session.json.enc ] && [ -n "$SESSION_SECRET" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in firstcry_session.json.enc -out firstcry_session.json \
              -pass pass:"$SESSION_SECRET" || rm -f firstcry_session.json
          fi

      - name: Check FirstCry
        run: python3 firstcry_monitor.py
        env:
          RUN_ONCE: '1'
          BUY_ENABLED: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRSTCRY_PHONE: ${{ secrets.FIRSTCRY_PHONE }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Encrypt FirstCry session
        if: always()
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          if [ -f firstcry_session.json ] && [ -n "$SESSION_SECRET" ]; then
            openssl enc -aes-256-cbc -pbkdf2 \
              -in firstcry_session.json -out firstcry_session.json.enc \
              -pass pass:"$SESSION_SECRET"
          fi

      - name: Upload checkout screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-debug
          path: buy_*.png
          if-no-files-found: ignore
