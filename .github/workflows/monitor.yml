name: FirstCry stock monitor

on:
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

concurrency:
  group: firstcry-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright pytest

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run notification-logic tests
        run: python -m pytest -q

      - name: Restore stock state
        uses: actions/cache@v4
        with:
          path: firstcry_state.json
          key: firstcry-state-${{ github.run_id }}
          restore-keys: |
            firstcry-state-

      - name: Check FirstCry
        run: python3 firstcry_monitor.py
        timeout-minutes: 10
        env:
          RUN_ONCE: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Start next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "${{ github.workflow }}" \
            --ref "${{ github.ref_name }}"
