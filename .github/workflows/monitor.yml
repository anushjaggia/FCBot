# Put this file at .github/workflows/monitor.yml in your repo (the one that
# also contains firstcry_monitor.py). GitHub's web UI lets you type that
# whole path straight into the "Create new file" name box -- it makes the
# folders for you, no terminal needed.
#
# Then: repo Settings -> Secrets and variables -> Actions -> New repository
# secret, and add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID there.
#
# GitHub disables scheduled workflows after ~60 days with no repo activity --
# if alerts stop, open the Actions tab and re-enable, or just make any commit.

name: FirstCry stock monitor

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes, UTC, best-effort (not exact)
  workflow_dispatch: {}      # adds a manual "Run workflow" button, handy for testing

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      # Carries stock state between runs so you're only notified on a
      # change, not re-pinged every 5 minutes while something stays in stock.
      - uses: actions/cache@v4
        with:
          path: firstcry_state.json
          key: firstcry-state-${{ github.run_id }}
          restore-keys: |
            firstcry-state-

      - run: python3 firstcry_monitor.py
        env:
          RUN_ONCE: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
